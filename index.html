<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NovaSol - Premium Wallet</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@solana/web3.js@1.95.8/lib/index.iife.min.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="text-gray-100 min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-md glass-card rounded-3xl p-6 glow-purple relative overflow-hidden">
    <div class="flex justify-between items-center mb-6">
      <div class="flex items-center gap-2">
        <div class="w-3 h-3 rounded-full bg-purple-500 animate-pulse"></div>
        <h1 class="text-xl font-bold bg-gradient-to-r from-purple-400 to-pink-500 bg-clip-text text-transparent">NovaSol</h1>
      </div>
      <div class="flex items-center gap-2 bg-gray-800/80 px-3 py-1.5 rounded-full border border-gray-700">
        <span id="net-badge" class="text-xs font-semibold text-yellow-400">DEVNET</span>
        <select id="network-select" onchange="switchNetwork()" class="bg-transparent text-xs text-gray-300 focus:outline-none cursor-pointer">
          <option value="devnet" class="bg-gray-900">Devnet</option>
          <option value="testnet" class="bg-gray-900">Testnet</option>
          <option value="mainnet-beta" class="bg-gray-900">Mainnet</option>
        </select>
      </div>
    </div>

    <div id="import-section" class="mb-6">
      <label class="block text-xs text-gray-400 mb-2">🔐 Enter Solana Address</label>
      <div class="flex gap-2">
        <input type="text" id="input-address" placeholder="e.g. 7xKX...3b89" class="w-full bg-gray-900/90 border border-gray-700 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-purple-500 text-gray-200">
        <button onclick="loadDashboard()" class="bg-purple-600 hover:bg-purple-500 px-4 py-2.5 rounded-xl font-semibold text-sm transition">Import</button>
      </div>
    </div>

    <div id="dashboard" class="hidden space-y-6">
      <div class="bg-gradient-to-br from-purple-900/40 to-indigo-900/40 rounded-2xl p-5 border border-purple-500/20 text-center relative">
        <button onclick="refreshAll()" class="absolute top-4 right-4 text-gray-400 hover:text-white text-sm" title="Refresh Balance">🔄</button>
        <span class="text-xs uppercase tracking-wider text-purple-300">SOL Balance</span>
        <div class="text-4xl font-extrabold my-2 text-white">
          <span id="sol-balance">0.00</span>
          <span class="text-purple-400 text-2xl">SOL</span>
        </div>
        <p id="active-pubkey" class="text-xs text-gray-400 truncate max-w-[250px] mx-auto"></p>
      </div>

      <div class="grid grid-cols-2 gap-3">
        <button onclick="toggleModal('send-modal', true)" class="bg-purple-600 hover:bg-purple-500 py-3 rounded-xl font-medium text-sm flex items-center justify-center gap-2 transition">📤 Send</button>
        <button onclick="toggleModal('receive-modal', true)" class="bg-gray-800 hover:bg-gray-700 border border-gray-700 py-3 rounded-xl font-medium text-sm flex items-center justify-center gap-2 transition">📥 Receive</button>
      </div>

      <div>
        <h3 class="text-xs font-semibold text-gray-400 mb-3 uppercase tracking-wider">SOL Wallet</h3>
        <div class="bg-gray-900/60 p-3 rounded-xl flex justify-between items-center border border-gray-800">
          <div class="flex items-center gap-3">
            <div class="w-8 h-8 rounded-full bg-purple-500/20 flex items-center justify-center text-purple-400 font-bold text-xs">SOL</div>
            <div>
              <p class="text-sm font-medium">Solana</p>
              <p class="text-xs text-gray-500">Native SOL</p>
            </div>
          </div>
          <p class="text-sm font-semibold" id="token-sol-val">0.00 SOL</p>
        </div>
      </div>
    </div>
  </div>

  <div id="receive-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 hidden">
    <div class="glass-card w-full max-w-sm rounded-2xl p-6 text-center space-y-4">
      <h3 class="text-lg font-bold text-white">📥 Receive Address</h3>
      <p class="text-xs text-gray-400">Share this address to receive SOL or SPL Tokens</p>
      <div class="bg-gray-900 p-3 rounded-xl border border-gray-800 break-all text-xs font-mono text-purple-300" id="modal-pubkey">--</div>
      <div class="flex gap-2">
        <button onclick="copyAddress()" class="w-full bg-purple-600 py-2.5 rounded-xl font-medium text-xs">Copy Address</button>
        <button onclick="toggleModal('receive-modal', false)" class="w-full bg-gray-800 py-2.5 rounded-xl font-medium text-xs">Close</button>
      </div>
    </div>
  </div>

  <div id="send-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 hidden">
    <div class="glass-card w-full max-w-sm rounded-2xl p-6 space-y-4">
      <h3 id="send-title" class="text-lg font-bold text-white">📤 Send SOL</h3>

      <div>
        <label class="text-xs text-gray-400 block mb-1">Recipient Address</label>
        <input type="text" id="send-to" placeholder="Solana Public Key" class="w-full bg-gray-900 border border-gray-700 rounded-xl p-2.5 text-xs text-white focus:outline-none focus:border-purple-500">
      </div>

      <div>
        <label id="amount-label" class="text-xs text-gray-400 block mb-1">Amount (SOL)</label>
        <input type="number" id="send-amount" step="any" min="0" placeholder="0.1" class="w-full bg-gray-900 border border-gray-700 rounded-xl p-2.5 text-xs text-white focus:outline-none focus:border-purple-500">
      </div>

      <div id="tx-status" class="text-xs text-center font-mono text-purple-400 min-h-[16px] break-all"></div>

      <div class="flex gap-2">
        <button onclick="executeTransaction()" class="w-full bg-purple-600 hover:bg-purple-500 py-2.5 rounded-xl font-medium text-xs">Sign & Approve</button>
        <button onclick="toggleModal('send-modal', false)" class="w-full bg-gray-800 hover:bg-gray-700 py-2.5 rounded-xl font-medium text-xs">Cancel</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
